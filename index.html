<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DAD MDB</title>
  <link rel="stylesheet" href="css/BiblioPeliStyle.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="banner">
    <h1>DAD MDB</h1>

    <!-- Barra de búsqueda -->
    <div class="buscador">
      <div class="input-wrapper">
        <svg class="icon lupa" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white" viewBox="0 0 16 16">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 
          1.415-1.414l-3.85-3.85zm-5.242 1.656a5.5 5.5 0 1 1 
          0-11 5.5 5.5 0 0 1 0 11z"/>
        </svg>

        <input type="text" id="campoBusqueda" placeholder="Buscar Película, Serie, Nombre, Año, Género, Director..." oninput="buscar()">

        <svg class="icon borrar" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white" viewBox="0 0 16 16" onclick="limpiarBusqueda()">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 
          7.293l2.646-2.647a.5.5 0 0 1 
          .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 
          8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 
          8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
        </svg>
      </div>

      <select id="ordenarPor" onchange="buscar()">
        <option value="">Ordenar...</option>
        <option value="titulo">Título A-Z</option>
        <option value="anio">Año</option>
      </select>
    </div>

    <!-- Menú superior -->
    <div class="menu">
      <button onclick="mostrarPeliculas()">Películas</button>
      <button onclick="mostrarSeries()">Series</button>
      <button onclick="mostrarGeneros()">Géneros</button>
      <button onclick="mostrarRecientes()">Recientes</button>
    </div>
  </div>

  <h2 id="tituloSeccion">Películas</h2>
  <div id="contenedor" class="contenedor contenedor-generos"></div>
</body>
</html>
  
  <!-- Paginación -->
  <div class="paginacion">
    <button onclick="irInicio()">Inicio</button>
    <button onclick="paginaAnterior()">Anterior</button>
    <span id="paginaInfo">Página 1 de 1</span>
    <button onclick="paginaSiguiente()">Siguiente</button>
    <button onclick="irFinal()">Final</button>
  </div>

  <script>
    let peliculas = [];
    let series = [];
    let generos = [];
    let recientes = [];
    let pagina = 1;
    let itemsPorPagina = 30;
    let modo = "peliculas"; 
    let modoAnterior = "peliculas";

    async function cargarCSV(ruta) {
      const resp = await fetch(ruta);
      const texto = await resp.text();
      const resultado = Papa.parse(texto, {header:true, skipEmptyLines:true});
      return resultado.data;
    }

    function renderItem(data, type, containerId) {
      const rating = parseFloat(data.vote_average) * 10;
      const radius = 20;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (rating/100)*circumference;
      let color = rating>=70 ? "#21d07a" : rating>=40 ? "#d2d531" : "#db2360";

      const div = document.createElement("div");
      div.className="pelicula";
      div.innerHTML=`
        <a href="https://www.themoviedb.org/${type}/${data.id}" target="_blank">
          <img src="https://image.tmdb.org/t/p/w300${data.poster_path}" alt="${data.title||data.name}">
          <p>${data.title||data.name}</p>
          <div class="rating-circle">
            <svg width="48" height="48">
              <circle cx="24" cy="24" r="${radius}" stroke="#444" stroke-width="3" fill="black"/>
              <circle class="progress" cx="24" cy="24" r="${radius}" stroke="${color}" stroke-width="3" fill="transparent"
                stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"/>
            </svg>
            <div class="rating-text">${parseFloat(data.vote_average).toFixed(1)}</div>
          </div>
          <div class="popup">
            <h3>${data.title||data.name}</h3>
            <p><strong>Estreno:</strong> ${data.release_date||data.first_air_date}</p>
            ${type==="movie"?`<p><strong>Director:</strong> ${data.director}</p>`:""}
            <p><strong>Reparto:</strong> ${data.actors}</p>
            <p><strong>Género:</strong> ${data.genres}</p>
            <p><strong>Calificación:</strong> ${parseFloat(data.vote_average).toFixed(1)} | <strong>Ubicación:</strong> ${data.ubicacion}</p>
            <p>${data.overview}</p>
          </div>
        </a>`;

      document.getElementById(containerId).appendChild(div);

      setTimeout(()=>{div.querySelector(".progress").setAttribute("stroke-dashoffset",offset);},100);

      let popupTimer;
      const card = div;
      const popup = div.querySelector(".popup");

      card.addEventListener("mouseenter", () => {
        popupTimer = setTimeout(() => {
          const rect = card.getBoundingClientRect();
          const espacioDerecha = window.innerWidth - rect.right;
          if (espacioDerecha < 300) {
            popup.classList.add("right");
          } else {
            popup.classList.remove("right");
          }
          popup.style.opacity = "1"; 
          popup.style.transform = "translateY(0)";
        }, 1000);
      });

      card.addEventListener("mouseleave", () => {
        clearTimeout(popupTimer);
        popup.style.opacity = "0"; 
        popup.style.transform = "translateY(20px)";
      });
    }

        // Mostrar películas
    function mostrarPeliculas(){
      modo = "peliculas";
      pagina = 1;
      document.getElementById("tituloSeccion").textContent = "Películas";
      renderPagina(peliculas, "movie");
    }

    // Mostrar series
    function mostrarSeries(){
      modo = "series";
      pagina = 1;
      document.getElementById("tituloSeccion").textContent = "Series";
      renderPagina(series, "tv");
    }

    // Mostrar recientes (ordenados por fecha)
    function mostrarRecientes(){
      modo="recientes";
      pagina=1;
      document.getElementById("tituloSeccion").textContent="Recientes";
      let items = (modoAnterior==="series"?series:peliculas);
      items.sort((a,b)=>(b.release_date||b.first_air_date).localeCompare(a.release_date||a.first_air_date));
      recientes = items.slice(0,30);
      renderPagina(recientes, modoAnterior==="series"?"tv":"movie");
    }

    // Mostrar géneros
    function mostrarGeneros(){
      modo="generos";
      pagina=1;
      document.getElementById("tituloSeccion").textContent="Géneros";
      document.getElementById("contenedor").innerHTML="";

      const imagenesGeneros = {
        "Acción":"https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",
        "Aventura":"https://image.tmdb.org/t/p/w500/2l05cFWJacyIsTpsqSgH0wQXe4V.jpg",
        "Animación":"https://image.tmdb.org/t/p/original/hHRvKl4zwS234fcjypa82A2Ecjr.jpg",
        "Comedia":"https://image.tmdb.org/t/p/original/7MWPHp6aErgfzgLFJIrFBzyvkn8.jpg",
        "Crimen":"https://image.tmdb.org/t/p/original/aKuFiU82s5ISJpGZp7YkIr3kCUd.jpg",
        "Ciencia ficción":"https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg",
        "Documental":"https://image.tmdb.org/t/p/original/unUbH6qKsBCz8lVK2soEQ1zsfYR.jpg",
        "Drama":"https://image.tmdb.org/t/p/original/ncKCQVXgk4BcQV6XbvesgZ2zLvZ.jpg",
        "Música":"https://image.tmdb.org/t/p/original/Aktq3lNarQAy520HyemewnFvFad.jpg",
        "Thriller":"https://image.tmdb.org/t/p/w500/5WJnxuw41sddupf8cwOxYftuvJG.jpg",
        "Terror":"https://image.tmdb.org/t/p/original/tFXcEccSQMf3lfhfXKSU9iRBpa3.jpg",
        "Western":"https://image.tmdb.org/t/p/original/eUZbn652KXfWMwh6Oe4PdeJfKuS.jpg"
      };

      const todosGeneros = [...peliculas.map(p=>p.genres), ...series.map(s=>s.genres)];
      const nombresIncluidos = new Set();
      const generosUnicos = [];

      todosGeneros.forEach(gStr=>{
        if(gStr){
          gStr.split(",").forEach(g=>{
            const nombre = g.trim();
            if(Object.keys(imagenesGeneros).includes(nombre) && !nombresIncluidos.has(nombre)){
              nombresIncluidos.add(nombre);
              generosUnicos.push({name:nombre});
            }
          });
        }
      });

      generosUnicos.forEach(g=>{
        const div=document.createElement("div");
        div.className="genero-card";
        const img=imagenesGeneros[g.name];
        div.style.backgroundImage=`url('${img}')`;
        div.innerHTML=`<div class="overlay"><p>${g.name}</p></div>`;
        div.onclick=()=>mostrarPorGenero(g.name);
        document.getElementById("contenedor").appendChild(div);
      });
    }

    // Mostrar por género seleccionado
    function mostrarPorGenero(nombreGenero){
      modo="generos";
      pagina=1;
      generoActualNombre=nombreGenero;
      document.getElementById("tituloSeccion").textContent="Género: "+nombreGenero;
      cargarPorGenero(nombreGenero);
      renderPagina(resultadosGenero,"movie");
    }

    // Cargar lista de películas y series de un género
    function cargarPorGenero(nombreGenero){
      resultadosGenero=[...peliculas,...series].filter(item =>
        item.genres && item.genres.includes(nombreGenero)
      );
    }

    // Mostrar página actual
    function renderPagina(lista, tipo) {
      document.getElementById("contenedor").innerHTML="";
      let inicio = (pagina-1)*itemsPorPagina;
      let fin = inicio+itemsPorPagina;
      let paginaItems = lista.slice(inicio,fin);

      paginaItems.forEach(item=>{
        renderItem(item,tipo,"contenedor");
      });

      actualizarInfoPaginacion(lista.length);
    }

    function actualizarInfoPaginacion(totalItems) {
      const totalPaginas = Math.ceil(totalItems / itemsPorPagina) || 1;
      document.getElementById("paginaInfo").textContent =
        `Página ${pagina} de ${totalPaginas}`;
    }

    // 🔎 Buscador
    function buscar(){
      const query = document.getElementById("campoBusqueda").value.toLowerCase().trim();
      const ordenar = document.getElementById("ordenarPor").value;

      if(!query && !ordenar){
        if(modo === "peliculas"){
          mostrarPeliculas();
        } else if(modo === "series"){
          mostrarSeries();
        } else {
          mostrarPeliculas();
        }
        return;
      }

      document.getElementById("tituloSeccion").textContent = "Resultados de búsqueda";
      document.getElementById("contenedor").innerHTML = "";

      let items = [];
      if(modo === "peliculas"){
        items = [...peliculas];
      } else if(modo === "series"){
        items = [...series];
      } else {
        items = [...peliculas, ...series];
      }

      let resultados = items.filter(item => {
        const titulo = (item.title || item.name || "").toLowerCase();
        const fecha = (item.release_date || item.first_air_date || "");
        const genero = (item.genres || "").toLowerCase();
        const director = (item.director || "").toLowerCase();
        const actores = (item.actors || "").toLowerCase();

        return titulo.includes(query) || 
               fecha.includes(query) || 
               genero.includes(query) || 
               director.includes(query) || 
               actores.includes(query);
      });

      if(ordenar === "titulo"){
        resultados.sort((a,b)=>(a.title||a.name).localeCompare(b.title||b.name));
      } else if(ordenar === "anio"){
        resultados.sort((a,b)=>(a.release_date||a.first_air_date).localeCompare(b.release_date||b.first_air_date));
      }

      if(resultados.length === 0){
        document.getElementById("contenedor").innerHTML = "<p>No se encontraron resultados.</p>";
      } else {
        resultados.forEach(item=>{
          renderItem(item, item.title?"movie":"tv", "contenedor");
        });
      }

      pagina = 1;
      actualizarInfoPaginacion(resultados.length);
    }

    function limpiarBusqueda(){
      document.getElementById("campoBusqueda").value = "";
      document.getElementById("ordenarPor").value = "";
      pagina = 1;
      mostrarPeliculas();
    }

        // Funciones de navegación de páginas
    function paginaAnterior(){
      if(pagina > 1){
        pagina--;
        refrescarModo();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function paginaSiguiente(){
      const totalItems = obtenerListaActual().length;
      const totalPaginas = Math.ceil(totalItems / itemsPorPagina);
      if(pagina < totalPaginas){
        pagina++;
        refrescarModo();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function irInicio(){
      pagina = 1;
      refrescarModo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function irFinal(){
      const totalItems = obtenerListaActual().length;
      const totalPaginas = Math.ceil(totalItems / itemsPorPagina);
      pagina = totalPaginas;
      refrescarModo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function obtenerListaActual(){
      switch (modo) {
        case "peliculas": return peliculas;
        case "series": return series;
        case "generos": return resultadosGenero;
        case "recientes": return recientes;
        default: return [];
      }
    }

    function refrescarModo(){
      switch (modo) {
        case "peliculas": renderPagina(peliculas, "movie"); break;
        case "series": renderPagina(series, "tv"); break;
        case "generos": renderPagina(resultadosGenero, "movie"); break;
        case "recientes": renderPagina(recientes, "movie"); break;
      }
    }

    // Inicialización optimizada con varios CSV desde carpeta data
    (async function(){
      const peliculasRaw1 = await cargarCSV("data/peliculas.csv");
      const peliculasRaw2 = await cargarCSV("data/peliculas1.csv");
      const seriesRaw1   = await cargarCSV("data/series.csv");
      const seriesRaw2   = await cargarCSV("data/series1.csv");

      peliculas = [...peliculasRaw1, ...peliculasRaw2].map(item => ({
        id: item.id,
        title: item.title,
        release_date: item.release_date,
        director: item.director,
        actors: item.actors,
        genres: item.genres,
        vote_average: item.vote_average,
        poster_path: item.poster_path,
        overview: item.overview,
        ubicacion: item.ubicacion
      }));

      series = [...seriesRaw1, ...seriesRaw2].map(item => ({
        id: item.id,
        name: item.name,
        first_air_date: item.first_air_date,
        actors: item.actors,
        genres: item.genres,
        vote_average: item.vote_average,
        poster_path: item.poster_path,
        overview: item.overview,
        ubicacion: item.ubicacion
      }));

      // Arrancamos mostrando películas
      mostrarPeliculas();
    })();
  </script>
</body>
</html>
