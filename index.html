  <script>
    let peliculas = [];

    // Nueva función para cargar datos desde CSV usando PapaParse
    async function cargarCSV(ruta) {
      const resp = await fetch(ruta);
      const texto = await resp.text();
      const resultado = Papa.parse(texto, {header:true, skipEmptyLines:true});
      return resultado.data;
    }

    // Renderizar tarjeta de película/serie
    function renderItem(data, type, containerId) {
      const rating = parseFloat(data.vote_average) * 10;
      const radius = 20;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (rating/100)*circumference;
      let color = rating>=70 ? "#21d07a" : rating>=40 ? "#d2d531" : "#db2360";

      const div = document.createElement("div");
      div.className="pelicula";
      div.innerHTML=`
        <a href="https://www.themoviedb.org/${type}/${data.id}" target="_blank">
          <img src="https://image.tmdb.org/t/p/w300${data.poster_path}" alt="${data.title||data.name}">
          <p>${data.title||data.name}</p>
          <div class="rating-circle">
            <svg width="48" height="48">
              <circle cx="24" cy="24" r="${radius}" stroke="#444" stroke-width="3" fill="black"/>
              <circle class="progress" cx="24" cy="24" r="${radius}" stroke="${color}" stroke-width="3" fill="transparent"
                stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"/>
            </svg>
            <div class="rating-text">${parseFloat(data.vote_average).toFixed(1)}</div>
          </div>
          <div class="popup">
            <h3>${data.title||data.name}</h3>
            <p><strong>Estreno:</strong> ${data.release_date||data.first_air_date}</p>
            ${type==="movie"?`<p><strong>Director:</strong> ${data.director}</p>`:""}
            <p><strong>Reparto:</strong> ${data.actors}</p>
            <p><strong>Género:</strong> ${data.genres}</p>
            <p><strong>Calificación:</strong> ${parseFloat(data.vote_average).toFixed(1)} | <strong>Ubicación:</strong> ${data.ubicacion}</p>
            <p>${data.overview}</p>
          </div>
        </a>`;

      document.getElementById(containerId).appendChild(div);

      // animación del círculo
      setTimeout(()=>{div.querySelector(".progress").setAttribute("stroke-dashoffset",offset);},100);

      // Control del popup con delay
      let popupTimer;
      const card = div;
      const popup = div.querySelector(".popup");

      card.addEventListener("mouseenter", () => {
        popupTimer = setTimeout(() => {
          const rect = card.getBoundingClientRect();
          const espacioDerecha = window.innerWidth - rect.right;
          if (espacioDerecha < 300) {
            popup.classList.add("right");
          } else {
            popup.classList.remove("right");
          }
          popup.style.opacity = "1"; 
          popup.style.transform = "translateY(0)";
        }, 1000);
      });

      card.addEventListener("mouseleave", () => {
        clearTimeout(popupTimer);
        popup.style.opacity = "0"; 
        popup.style.transform = "translateY(20px)";
      });
    }

      modo="recientes";

      let items = (modoAnterior==="series"?series:peliculas);

      recientes = items.slice(0,30);
      renderPagina(recientes, modoAnterior==="series"?"tv":"movie");
    }

        items = [...peliculas];
      } else if(modo === "series"){
        items = [...series];

      }

      // Filtrar resultados
      let resultados = items.filter(item => {
        const titulo = (item.title || item.name || "").toLowerCase();
        const fecha = (item.release_date || item.first_air_date || "");
        const genero = (item.genres || "").toLowerCase();
        const director = (item.director || "").toLowerCase();
        const actores = (item.actors || "").toLowerCase();

        return titulo.includes(query) || 
               fecha.includes(query) ||

      });

      // Ordenar resultados
      if(ordenar === "titulo"){
        resultados.sort((a,b)=>(a.title||a.name).localeCompare(b.title||b.name));
      } else if(ordenar === "anio"){
        resultados.sort((a,b)=>(a.release_date||a.first_air_date).localeCompare(b.release_date||b.first_air_date));
      }

      // Mostrar resultados
      if(resultados.length === 0){
        document.getElementById("contenedor").innerHTML = "<p>No se encontraron resultados.</p>";
      } else {
        resultados.forEach(item=>{
          renderItem(item, item.title?"movie":"tv", "contenedor");
        });
      }

      pagina = 1;
      actualizarInfoPaginacion(resultados.length);
    }

    function limpiarBusqueda(){
      document.getElementById("campoBusqueda").value = "";
      document.getElementById("ordenarPor").value = "";
      pagina = 1;
      mostrarPeliculas();
    }

    // Funciones de navegación de páginas
    function paginaAnterior(){
      if(pagina > 1){
        pagina--;
        refrescarModo();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function paginaSiguiente(){
      const totalItems = obtenerListaActual().length;
      const totalPaginas = Math.ceil(totalItems / itemsPorPagina);
      if(pagina < totalPaginas){
        pagina++;
        refrescarModo();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function irInicio(){
      pagina = 1;
      refrescarModo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function irFinal(){
      const totalItems = obtenerListaActual().length;
      const totalPaginas = Math.ceil(totalItems / itemsPorPagina);
      pagina = totalPaginas;
      refrescarModo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function obtenerListaActual(){
      switch (modo) {
        case "peliculas": return peliculas;
        case "series": return series;
        case "generos": return resultadosGenero;
        case "recientes": return recientes;
        default: return [];
      }
    }

    function refrescarModo(){
      switch (modo) {
        case "peliculas": renderPagina(peliculas, "movie"); break;
        case "series": renderPagina(series, "tv"); break;
        case "generos": renderPagina(resultadosGenero, "movie"); break;
        case "recientes": renderPagina(recientes, "movie"); break;
      }
    }
        // Función genérica para cargar un CSV con PapaParse
function cargarCSV(archivo) {
  return new Promise((resolve, reject) => {
    Papa.parse(archivo, {
      download: true,
      header: true,
      complete: results => resolve(results.data),
      error: err => reject(err)
    });
  });
}

// Función para cargar varios CSV y unirlos
async function cargarMultiplesCSV(archivos) {
  let datos = [];
  for (const archivo of archivos) {
    const parcial = await cargarCSV(archivo);
    datos = datos.concat(parcial);
  }
  return datos;
}

})();
